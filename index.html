<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mix Design - Korat Batching Plant</title>

  <!-- React & ReactDOM (Production Build) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (แปลง JSX ในเบราว์เซอร์) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { 
      background-color: #efece2; 
      -webkit-tap-highlight-color: transparent; 
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Helper Component สำหรับแสดง Lucide Icons
    const Icon = ({ name, size = 18, color, className = "", style = {} }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} className={className} style={{ width: size, height: size, color, display: 'inline-block', ...style }}></i>;
    };

    const MATERIAL_COLS = [
      { key: "cement", label: "Cement" },
      { key: "rock", label: "Rock" },
      { key: "sand", label: "Sand" },
      { key: "water", label: "Water" },
      { key: "admix", label: "Admixture" },
      { key: "admix2", label: "Admixture 2" },
      { key: "flyash", label: "Fly Ash" },
      { key: "air", label: "Air" },
    ];

    const GROUPS = {
      A: { label: "A", short: "100%", desc: "วัตถุดิบเต็ม 100%", reduce: 0 },
      B: { label: "B", short: "-3%", desc: "ลดทุกอย่างลง 3% (ยกเว้นน้ำ)", reduce: 0.03 },
      C: { label: "C", short: "-5%", desc: "ลดทุกอย่างลง 5% (ยกเว้นน้ำ)", reduce: 0.05 },
    };

    const STORAGE_KEY = "mixdesign-state-v1";

    let nextRowId = 4;
    let nextAdjId = 1;

    const seedRows = [
      { id: 1, orderNo: "73593250", cement: 378, rock: 1080, sand: 855, water: 148, admix: 4800, admix2: 5800, flyash: 20, air: 0, qty: 18 },
      { id: 2, orderNo: "30022121", cement: 0, rock: 0, sand: 0, water: 0, admix: 0, admix2: 0, flyash: 0, air: 0, qty: 0 },
      { id: 3, orderNo: "83135901", cement: 0, rock: 0, sand: 0, water: 0, admix: 0, admix2: 0, flyash: 0, air: 0, qty: 0 },
    ];

    function num(v) {
      const n = parseFloat(v);
      return isNaN(n) ? 0 : n;
    }

    function MixDesignCalculator() {
      const [group, setGroup] = useState("A");
      const [rows, setRows] = useState(seedRows);
      const [showAdjust, setShowAdjust] = useState(false);
      const [adjustments, setAdjustments] = useState([]);
      const [saveState, setSaveState] = useState("idle");
      const [saveError, setSaveError] = useState("");
      const [storageAvailable, setStorageAvailable] = useState(true);

      const [draftOrderId, setDraftOrderId] = useState(null);
      const [draftMaterial, setDraftMaterial] = useState(MATERIAL_COLS[0].key);
      const [draftSign, setDraftSign] = useState("add");
      const [draftValue, setDraftValue] = useState("");
      const [draftQty, setDraftQty] = useState("");

      const reduce = GROUPS[group].reduce;

      // โหลดข้อมูลจาก LocalStorage
      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const data = JSON.parse(saved);
            if (data.rows && data.rows.length) {
              setRows(data.rows);
              nextRowId = Math.max(...data.rows.map((r) => r.id)) + 1;
            }
            if (data.group) setGroup(data.group);
            if (data.adjustments) {
              setAdjustments(data.adjustments);
              nextAdjId = data.adjustments.length ? Math.max(...data.adjustments.map((a) => a.id)) + 1 : 1;
            }
          }
        } catch (e) {
          setStorageAvailable(false);
        }
      }, []);

      useEffect(() => {
        if (rows.length && draftOrderId === null) setDraftOrderId(rows[0].id);
      }, [rows, draftOrderId]);

      const baseResults = useMemo(() => {
        return rows.map((r) => {
          const qty = num(r.qty);
          const out = {};
          MATERIAL_COLS.forEach((c) => {
            const val = num(r[c.key]);
            out[c.key] = c.key === "water" ? val * qty : val * qty * (1 - reduce) * 0.001;
          });
          return out;
        });
      }, [rows, reduce]);

      function adjustmentContribution(orderId, materialKey) {
        return adjustments
          .filter((a) => a.orderId === orderId && a.material === materialKey)
          .reduce((sum, a) => {
            const raw = materialKey === "water" ? a.value * a.qty : a.value * a.qty * (1 - reduce) * 0.001;
            return sum + (a.sign === "reduce" ? -raw : raw);
          }, 0);
      }

      const finalResults = useMemo(() => {
        return rows.map((r, i) => {
          const out = {};
          MATERIAL_COLS.forEach((c) => {
            out[c.key] = baseResults[i][c.key] + adjustmentContribution(r.id, c.key);
          });
          return out;
        });
      }, [baseResults, adjustments, reduce]);

      const totals = useMemo(() => {
        const t = {};
        MATERIAL_COLS.forEach((c) => (t[c.key] = 0));
        finalResults.forEach((r) => MATERIAL_COLS.forEach((c) => (t[c.key] += r[c.key])));
        return t;
      }, [finalResults]);

      function updateRow(id, key, value) {
        setRows((prev) => prev.map((r) => (r.id === id ? { ...r, [key]: value } : r)));
      }

      function addRow() {
        const blank = { id: nextRowId++, orderNo: "", qty: 0 };
        MATERIAL_COLS.forEach((c) => (blank[c.key] = 0));
        setRows((prev) => [...prev, blank]);
      }

      function removeRow(id) {
        setRows((prev) => prev.filter((r) => r.id !== id));
        setAdjustments((prev) => prev.filter((a) => a.orderId !== id));
      }

      function addAdjustment() {
        const v = num(draftValue);
        const q = num(draftQty);
        if (!draftOrderId || v === 0 || q === 0) return;
        setAdjustments((prev) => [
          ...prev,
          { id: nextAdjId++, orderId: draftOrderId, material: draftMaterial, sign: draftSign, value: v, qty: q },
        ]);
        setDraftValue("");
        setDraftQty("");
      }

      function removeAdjustment(id) {
        setAdjustments((prev) => prev.filter((a) => a.id !== id));
      }

      function handleSave() {
        setSaveState("saving");
        setSaveError("");
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows, group, adjustments }));
          setSaveState("saved");
          setTimeout(() => setSaveState("idle"), 1800);
        } catch (e) {
          setSaveError("บันทึกไม่สำเร็จ: เกิดข้อผิดพลาดทางเทคนิค");
          setSaveState("idle");
        }
      }

      function buildReportHTML() {
        const groupInfo = GROUPS[group];
        const rowsHtml = rows
          .map((r) => {
            const cells = MATERIAL_COLS.map((c) => `<td>${num(r[c.key])}</td>`).join("");
            return `<tr><td>${r.orderNo || "—"}</td>${cells}<td>${r.qty}</td></tr>`;
          })
          .join("");
        const resultRowsHtml = rows
          .map((r, i) => {
            const cells = MATERIAL_COLS.map((c) => `<td>${finalResults[i][c.key].toFixed(3)}</td>`).join("");
            return `<tr><td>${r.orderNo || "—"}</td>${cells}</tr>`;
          })
          .join("");
        const totalCells = MATERIAL_COLS.map((c) => `<td><b>${totals[c.key].toFixed(3)}</b></td>`).join("");
        const adjRowsHtml = adjustments
          .map((a) => {
            const rIdx = rows.findIndex((r) => r.id === a.orderId);
            const orderLabel = rIdx >= 0 ? rows[rIdx].orderNo || "—" : "—";
            const matLabel = MATERIAL_COLS.find((c) => c.key === a.material)?.label;
            return `<tr><td>${orderLabel}</td><td>${matLabel}</td><td>${a.sign === "reduce" ? "-" : "+"}${a.value}</td><td>${a.qty}</td></tr>`;
          })
          .join("");

        return `<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<title>Mix Design Report</title>
<style>
  body { font-family: Arial, sans-serif; color:#23211d; padding: 24px; }
  h1 { margin-bottom: 0; }
  .sub { color:#78766e; margin-top:4px; margin-bottom:20px; font-size:13px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; font-size: 12px; }
  th, td { border: 1px solid #999; padding: 5px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #23211d; color: #fff; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color:#78766e; border-bottom: 2px solid #23211d; padding-bottom: 4px; }
  @media print { .no-print { display:none; } }
</style>
</head>
<body>
  <div class="no-print" style="margin-bottom:16px;">
    <button onclick="window.print()" style="padding:8px 16px;font-weight:bold;">พิมพ์ / บันทึก PDF</button>
  </div>
  <h1>Mix Design — Korat Batching Plant</h1>
  <div class="sub">คำนวณมิกซ์ By Pongston &nbsp;|&nbsp; Group ${groupInfo.label} (${groupInfo.desc}) &nbsp;|&nbsp; พิมพ์เมื่อ ${new Date().toLocaleString("th-TH")}</div>

  <h2>วัตถุดิบต่อหน่วย (kg)</h2>
  <table>
    <tr><th>Order</th>${MATERIAL_COLS.map((c) => `<th>${c.label}</th>`).join("")}<th>จำนวน</th></tr>
    ${rowsHtml}
  </table>

  ${adjustments.length ? `<h2>รายการปรับวัตถุดิบเพิ่มเติม</h2>
  <table>
    <tr><th>Order</th><th>วัตถุดิบ</th><th>ค่า</th><th>คิว</th></tr>
    ${adjRowsHtml}
  </table>` : ""}

  <h2>ผลลัพธ์ (ตัน / kg)</h2>
  <table>
    <tr><th>Order</th>${MATERIAL_COLS.map((c) => `<th>${c.label}</th>`).join("")}</tr>
    ${resultRowsHtml}
    <tr><td><b>รวม</b></td>${totalCells}</tr>
  </table>
</body></html>`;
      }

      function handlePrint() {
        const html = buildReportHTML();
        const blob = new Blob([html], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `mix-design-report-${Date.now()}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }

      const orderOptions = rows.map((r, i) => ({ id: r.id, label: `${i + 1}. ${r.orderNo || "(ไม่ระบุเลขที่)"}` }));

      return (
        <div className="min-h-screen w-full" style={{ background: "#efece2" }}>
          <div className="max-w-6xl mx-auto px-4 py-6 sm:px-6 sm:py-10">
            {/* Header */}
            <div className="flex items-start justify-between gap-4 mb-5 border-b-2 pb-4" style={{ borderColor: "#23211d" }}>
              <div>
                <div className="flex items-center gap-2" style={{ color: "#c1502e" }}>
                  <Icon name="layers" size={18} />
                  <span className="text-xs font-bold tracking-[0.2em] uppercase">Korat Batching Plant</span>
                </div>
                <h1
                  className="text-3xl sm:text-4xl font-black tracking-tight mt-1"
                  style={{ color: "#23211d", fontFamily: "Georgia, 'Times New Roman', serif" }}
                >
                  Mix Design
                </h1>
                <p className="text-xs mt-1" style={{ color: "#78766e" }}>คำนวณมิกซ์ By Pongston</p>
              </div>
              <Icon name="calculator" size={22} className="hidden sm:block" style={{ color: "#78766e" }} />
            </div>

            {!storageAvailable && (
              <div className="flex items-start gap-2 mb-4 px-3 py-2 text-xs" style={{ background: "#fbe9e2", color: "#8a3b1f", border: "1px solid #e0a888" }}>
                <Icon name="alert-circle" size={14} className="mt-0.5 shrink-0" />
                <span>การบันทึกถาวรใช้ไม่ได้ในเบราว์เซอร์นี้ ข้อมูลจะยังคงอยู่ระหว่างใช้งาน แต่จะหายไปเมื่อปิดหน้าต่าง — ใช้ปุ่ม "พิมพ์ / บันทึก PDF" เพื่อเก็บสำเนาไว้แทน</span>
              </div>
            )}

            {/* Group Selector */}
            <div className="flex items-center gap-3 mb-6 flex-wrap">
              <span className="text-xs font-bold uppercase tracking-widest" style={{ color: "#78766e" }}>Group</span>
              <div className="inline-flex border-2" style={{ borderColor: "#23211d" }}>
                {Object.entries(GROUPS).map(([key, g], idx) => {
                  const active = group === key;
                  return (
                    <button
                      key={key}
                      onClick={() => setGroup(key)}
                      className="px-3 py-1.5 text-sm font-bold transition-colors"
                      style={{
                        background: active ? "#23211d" : "#ffffff",
                        color: active ? "#f5f3ee" : "#23211d",
                        borderLeft: idx === 0 ? "none" : "1px solid #23211d",
                      }}
                      title={g.desc}
                    >
                      {g.label}. <span style={{ color: active ? "#e8916b" : "#c1502e" }}>{g.short}</span>
                    </button>
                  );
                })}
              </div>
              <span className="text-xs" style={{ color: "#a09d92" }}>{GROUPS[group].desc}</span>
            </div>

            {/* Input Table */}
            <div className="mb-2 text-xs font-bold uppercase tracking-widest" style={{ color: "#78766e" }}>
              วัตถุดิบต่อหน่วย (kg) — แก้ไขได้
            </div>
            <div className="overflow-x-auto border-2 mb-4" style={{ borderColor: "#23211d", background: "#ffffff" }}>
              <table className="w-full text-sm" style={{ minWidth: 920 }}>
                <thead>
                  <tr style={{ background: "#23211d", color: "#f5f3ee" }}>
                    <th className="text-left px-3 py-2 font-semibold sticky left-0" style={{ background: "#23211d", minWidth: 120 }}>
                      เลขที่ Order
                    </th>
                    {MATERIAL_COLS.map((c) => (
                      <th key={c.key} className="text-right px-3 py-2 font-semibold" style={{ minWidth: 90 }}>{c.label}</th>
                    ))}
                    <th className="text-right px-3 py-2 font-semibold" style={{ minWidth: 80 }}>จำนวน</th>
                    <th className="px-2 py-2" style={{ minWidth: 44 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={r.id} style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0", borderTop: "1px solid #e3e0d5" }}>
                      <td className="px-3 py-1.5 sticky left-0" style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0" }}>
                        <input
                          value={r.orderNo}
                          onChange={(e) => updateRow(r.id, "orderNo", e.target.value)}
                          className="w-full bg-transparent outline-none font-mono text-xs"
                          style={{ color: "#23211d" }}
                          placeholder="—"
                        />
                      </td>
                      {MATERIAL_COLS.map((c) => (
                        <td key={c.key} className="px-2 py-1.5">
                          <input
                            type="number"
                            value={r[c.key]}
                            onChange={(e) => updateRow(r.id, c.key, e.target.value)}
                            className="w-full bg-transparent outline-none text-right font-mono"
                            style={{ color: c.key === "air" ? "#c1502e" : "#23211d" }}
                          />
                        </td>
                      ))}
                      <td className="px-2 py-1.5">
                        <input
                          type="number"
                          value={r.qty}
                          onChange={(e) => updateRow(r.id, "qty", e.target.value)}
                          className="w-full bg-transparent outline-none text-right font-mono font-semibold"
                          style={{ color: "#23211d" }}
                        />
                      </td>
                      <td className="px-2 py-1.5 text-center">
                        <button onClick={() => removeRow(r.id)} title="ลบแถว" style={{ color: "#78766e" }}>
                          <Icon name="trash-2" size={15} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <button
              onClick={addRow}
              className="mb-6 inline-flex items-center gap-1.5 px-3 py-2 text-xs font-bold uppercase tracking-wider border-2"
              style={{ borderColor: "#23211d", color: "#23211d", background: "#ffffff" }}
            >
              <Icon name="plus" size={14} /> เพิ่มแถว
            </button>

            {/* Adjustment Panel */}
            <div className="mb-6 border-2" style={{ borderColor: "#23211d", background: "#ffffff" }}>
              <div className="flex items-center gap-2 px-4 py-3 cursor-pointer select-none" onClick={() => setShowAdjust((s) => !s)}>
                <span
                  className="w-5 h-5 flex items-center justify-center border-2 shrink-0"
                  style={{ borderColor: "#23211d", background: showAdjust ? "#c1502e" : "#ffffff" }}
                >
                  {showAdjust && <Icon name="check" size={13} color="#fff" />}
                </span>
                <span className="text-sm font-bold" style={{ color: "#23211d" }}>
                  ปรับวัตถุดิบเพิ่มเติมรายออเดอร์ (แสดงรายละเอียด 3 หัวข้อ)
                </span>
                <Icon
                  name="chevron-down"
                  size={16}
                  className="ml-auto transition-transform"
                  style={{ color: "#78766e", transform: showAdjust ? "rotate(180deg)" : "none" }}
                />
              </div>

              {showAdjust && (
                <div className="px-4 pb-4 pt-1 border-t-2" style={{ borderColor: "#e3e0d5" }}>
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 mt-3">
                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: "#78766e" }}>1. เลขที่ออเดอร์</div>
                      <select
                        value={draftOrderId ?? ""}
                        onChange={(e) => setDraftOrderId(Number(e.target.value))}
                        className="w-full border-2 px-2 py-1.5 text-sm bg-white"
                        style={{ borderColor: "#d8d5cb", color: "#23211d" }}
                      >
                        {orderOptions.map((o) => (
                          <option key={o.id} value={o.id}>{o.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: "#78766e" }}>2. ชนิดวัตถุดิบ</div>
                      <select
                        value={draftMaterial}
                        onChange={(e) => setDraftMaterial(e.target.value)}
                        className="w-full border-2 px-2 py-1.5 text-sm bg-white"
                        style={{ borderColor: "#d8d5cb", color: "#23211d" }}
                      >
                        {MATERIAL_COLS.map((c) => (
                          <option key={c.key} value={c.key}>{c.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1" style={{ color: "#78766e" }}>3. ค่า (กก.) / คิว</div>
                      <div className="flex gap-1">
                        <select
                          value={draftSign}
                          onChange={(e) => setDraftSign(e.target.value)}
                          className="border-2 px-1 py-1.5 text-sm bg-white shrink-0"
                          style={{ borderColor: "#d8d5cb", color: draftSign === "reduce" ? "#c1502e" : "#2e7d46" }}
                        >
                          <option value="add">เพิ่ม +</option>
                          <option value="reduce">ลด −</option>
                        </select>
                        <input
                          type="number"
                          value={draftValue}
                          onChange={(e) => setDraftValue(e.target.value)}
                          placeholder="ค่า"
                          className="w-full border-2 px-2 py-1.5 text-sm font-mono"
                          style={{ borderColor: "#d8d5cb", color: "#23211d" }}
                        />
                        <input
                          type="number"
                          value={draftQty}
                          onChange={(e) => setDraftQty(e.target.value)}
                          placeholder="คิว"
                          className="w-full border-2 px-2 py-1.5 text-sm font-mono"
                          style={{ borderColor: "#d8d5cb", color: "#23211d" }}
                        />
                      </div>
                    </div>

                    <div className="flex items-end">
                      <button
                        onClick={addAdjustment}
                        className="w-full px-3 py-2 text-xs font-bold uppercase tracking-wider"
                        style={{ background: "#23211d", color: "#f5f3ee" }}
                      >
                        4. รวมกับวัตถุดิบที่เลือก
                      </button>
                    </div>
                  </div>

                  {adjustments.length > 0 && (
                    <div className="mt-4 overflow-x-auto border-2" style={{ borderColor: "#e3e0d5" }}>
                      <table className="w-full text-xs" style={{ minWidth: 560 }}>
                        <thead>
                          <tr style={{ background: "#f0eee6", color: "#78766e" }}>
                            <th className="text-left px-2 py-1.5">ออเดอร์</th>
                            <th className="text-left px-2 py-1.5">วัตถุดิบ</th>
                            <th className="text-right px-2 py-1.5">ค่า</th>
                            <th className="text-right px-2 py-1.5">คิว</th>
                            <th className="text-right px-2 py-1.5">ผลรวม (kg→ton)</th>
                            <th className="px-2 py-1.5"></th>
                          </tr>
                        </thead>
                        <tbody>
                          {adjustments.map((a) => {
                            const rowIdx = rows.findIndex((r) => r.id === a.orderId);
                            const orderLabel = rowIdx >= 0 ? `${rowIdx + 1}. ${rows[rowIdx].orderNo || "—"}` : "—";
                            const matLabel = MATERIAL_COLS.find((c) => c.key === a.material)?.label;
                            const raw = a.material === "water" ? a.value * a.qty : a.value * a.qty * (1 - reduce) * 0.001;
                            const signed = a.sign === "reduce" ? -raw : raw;
                            return (
                              <tr key={a.id} style={{ borderTop: "1px solid #e3e0d5" }}>
                                <td className="px-2 py-1.5 font-mono">{orderLabel}</td>
                                <td className="px-2 py-1.5">{matLabel}</td>
                                <td className="px-2 py-1.5 text-right font-mono" style={{ color: a.sign === "reduce" ? "#c1502e" : "#2e7d46" }}>
                                  {a.sign === "reduce" ? "−" : "+"}{a.value}
                                </td>
                                <td className="px-2 py-1.5 text-right font-mono">{a.qty}</td>
                                <td className="px-2 py-1.5 text-right font-mono font-semibold">{signed.toFixed(3)}</td>
                                <td className="px-2 py-1.5 text-center">
                                  <button onClick={() => removeAdjustment(a.id)} style={{ color: "#78766e" }}>
                                    <Icon name="trash-2" size={13} />
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Results Table */}
            <div className="mb-2 text-xs font-bold uppercase tracking-widest" style={{ color: "#78766e" }}>
              ผลลัพธ์ (Group {group} · {GROUPS[group].short}) — ตัน / kg{adjustments.length > 0 ? " · รวมรายการปรับแล้ว" : ""}
            </div>
            <div className="overflow-x-auto border-2 mb-4" style={{ borderColor: "#23211d", background: "#ffffff" }}>
              <table className="w-full text-sm" style={{ minWidth: 820 }}>
                <thead>
                  <tr style={{ background: "#c1502e", color: "#f5f3ee" }}>
                    <th className="text-left px-3 py-2 font-semibold sticky left-0" style={{ background: "#c1502e", minWidth: 120 }}>เลขที่ Order</th>
                    {MATERIAL_COLS.map((c) => (
                      <th key={c.key} className="text-right px-3 py-2 font-semibold" style={{ minWidth: 100 }}>{c.label} ผลลัพธ์</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={r.id} style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0", borderTop: "1px solid #e3e0d5" }}>
                      <td className="px-3 py-1.5 font-mono text-xs sticky left-0" style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0" }}>
                        {r.orderNo || "—"}
                      </td>
                      {MATERIAL_COLS.map((c) => {
                        const adjusted = adjustmentContribution(r.id, c.key) !== 0;
                        return (
                          <td key={c.key} className="px-3 py-1.5 text-right font-mono" style={{ color: adjusted ? "#c1502e" : "#23211d", fontWeight: adjusted ? 700 : 400 }}>
                            {finalResults[i][c.key].toFixed(3)}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                  <tr style={{ borderTop: "2px solid #23211d", background: "#f0eee6" }}>
                    <td className="px-3 py-2 font-bold text-xs uppercase sticky left-0" style={{ background: "#f0eee6", color: "#23211d" }}>รวม / Total</td>
                    {MATERIAL_COLS.map((c) => (
                      <td key={c.key} className="px-3 py-2 text-right font-mono font-bold" style={{ color: "#c1502e" }}>{totals[c.key].toFixed(3)}</td>
                    ))}
                  </tr>
                </tbody>
              </table>
            </div>

            {/* Actions */}
            <div className="flex flex-wrap gap-2 items-center">
              <button
                onClick={handleSave}
                className="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold uppercase tracking-wider"
                style={{ background: "#23211d", color: "#f5f3ee" }}
              >
                <Icon name="save" size={14} />
                {saveState === "saving" ? "กำลังบันทึก..." : saveState === "saved" ? "บันทึกแล้ว ✓" : "บันทึก"}
              </button>
              <button
                onClick={handlePrint}
                className="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold uppercase tracking-wider border-2"
                style={{ borderColor: "#23211d", color: "#23211d", background: "#ffffff" }}
              >
                <Icon name="printer" size={14} /> พิมพ์ / บันทึก PDF
              </button>
              {saveError && <span className="text-xs" style={{ color: "#c1502e" }}>{saveError}</span>}
            </div>

            <p className="text-xs mt-2" style={{ color: "#a09d92" }}>
              "พิมพ์ / บันทึก PDF" จะดาวน์โหลดไฟล์รายงาน (.html) — เปิดไฟล์นั้นแล้วกดปุ่มพิมพ์ในหน้า หรือใช้เมนู Print ของเบราว์เซอร์แล้วเลือก "Save as PDF"
            </p>

            <p className="text-xs mt-4" style={{ color: "#a09d92" }}>
              สูตร: ผลลัพธ์ = วัตถุดิบ × จำนวน × (1 − % หักของกลุ่ม) × 0.001 (แปลง กก. → ตัน) · น้ำไม่ถูกหักเปอร์เซ็นต์และไม่แปลงหน่วย ·
              คอลัมน์ Air ใช้สูตรเดียวกับ Cement · รายการปรับต่อออเดอร์จะถูกบวก/ลบเข้ากับผลลัพธ์ของวัตถุดิบนั้นโดยตรง
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<MixDesignCalculator />);
  </script>
</body>
</html>
