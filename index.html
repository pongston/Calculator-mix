<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mix Design — Korat Batching Plant</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #efece2;
      color: #23211d;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom Input Focus Styles */
    input:focus, select:focus {
      outline: 2px solid #c1502e;
      outline-offset: -1px;
    }

    /* Remove Spin Buttons on Number Inputs for clean look */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const MATERIAL_COLS = [
      { key: "cement", label: "Cement" },
      { key: "rock", label: "Rock" },
      { key: "sand", label: "Sand" },
      { key: "water", label: "Water" },
      { key: "admix", label: "Admixture" },
      { key: "admix2", label: "Admixture 2" },
      { key: "flyash", label: "Fly Ash" },
      { key: "air", label: "Air" },
    ];

    const GROUPS = {
      A: { label: "A", short: "100%", desc: "วัตถุดิบเต็ม 100%", reduce: 0 },
      B: { label: "B", short: "-3%", desc: "ลดทุกอย่างลง 3% (ยกเว้นน้ำ)", reduce: 0.03 },
      C: { label: "C", short: "-5%", desc: "ลดทุกอย่างลง 5% (ยกเว้นน้ำ)", reduce: 0.05 },
    };

    const STORAGE_KEY = "mixdesign-state-v1";

    let nextRowId = 4;
    let nextAdjId = 1;

    const seedRows = [
      { id: 1, orderNo: "73593250", cement: 378, rock: 1080, sand: 855, water: 148, admix: 4800, admix2: 5800, flyash: 20, air: 0, qty: 18 },
      { id: 2, orderNo: "30022121", cement: 0, rock: 0, sand: 0, water: 0, admix: 0, admix2: 0, flyash: 0, air: 0, qty: 0 },
      { id: 3, orderNo: "83135901", cement: 0, rock: 0, sand: 0, water: 0, admix: 0, admix2: 0, flyash: 0, air: 0, qty: 0 },
    ];

    function num(v) {
      const n = parseFloat(v);
      return isNaN(n) ? 0 : n;
    }

    function App() {
      const [group, setGroup] = useState("A");
      const [rows, setRows] = useState(seedRows);
      const [showAdjust, setShowAdjust] = useState(false);
      const [adjustments, setAdjustments] = useState([]);
      const [saveState, setSaveState] = useState("idle"); // idle | saving | saved
      const [saveError, setSaveError] = useState("");

      const [draftOrderId, setDraftOrderId] = useState(null);
      const [draftMaterial, setDraftMaterial] = useState(MATERIAL_COLS[0].key);
      const [draftSign, setDraftSign] = useState("add");
      const [draftValue, setDraftValue] = useState("");
      const [draftQty, setDraftQty] = useState("");

      const reduce = GROUPS[group].reduce;

      useEffect(() => {
        try {
          const savedData = localStorage.getItem(STORAGE_KEY);
          if (savedData) {
            const data = JSON.parse(savedData);
            if (data.rows && data.rows.length) {
              setRows(data.rows);
              nextRowId = Math.max(...data.rows.map((r) => r.id)) + 1;
            }
            if (data.group) setGroup(data.group);
            if (data.adjustments) {
              setAdjustments(data.adjustments);
              nextAdjId = data.adjustments.length ? Math.max(...data.adjustments.map((a) => a.id)) + 1 : 1;
            }
          }
        } catch (e) {
          console.warn("Could not load saved state from localStorage:", e);
        }
      }, []);

      useEffect(() => {
        if (rows.length && (draftOrderId === null || !rows.some(r => r.id === draftOrderId))) {
          setDraftOrderId(rows[0].id);
        }
      }, [rows, draftOrderId]);

      // Re-render lucide icons on updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const baseResults = useMemo(() => {
        return rows.map((r) => {
          const qty = num(r.qty);
          const out = {};
          MATERIAL_COLS.forEach((c) => {
            const val = num(r[c.key]);
            out[c.key] = c.key === "water" ? val * qty : val * qty * (1 - reduce) * 0.001;
          });
          return out;
        });
      }, [rows, reduce]);

      function adjustmentContribution(orderId, materialKey) {
        return adjustments
          .filter((a) => a.orderId === orderId && a.material === materialKey)
          .reduce((sum, a) => {
            const raw = materialKey === "water" ? a.value * a.qty : a.value * a.qty * (1 - reduce) * 0.001;
            return sum + (a.sign === "reduce" ? -raw : raw);
          }, 0);
      }

      const finalResults = useMemo(() => {
        return rows.map((r, i) => {
          const out = {};
          MATERIAL_COLS.forEach((c) => {
            out[c.key] = baseResults[i][c.key] + adjustmentContribution(r.id, c.key);
          });
          return out;
        });
      }, [baseResults, adjustments, reduce]);

      const totals = useMemo(() => {
        const t = {};
        MATERIAL_COLS.forEach((c) => (t[c.key] = 0));
        finalResults.forEach((r) => MATERIAL_COLS.forEach((c) => (t[c.key] += r[c.key])));
        return t;
      }, [finalResults]);

      function updateRow(id, key, value) {
        setRows((prev) => prev.map((r) => (r.id === id ? { ...r, [key]: value } : r)));
      }

      function addRow() {
        const blank = { id: nextRowId++, orderNo: "", qty: 0 };
        MATERIAL_COLS.forEach((c) => (blank[c.key] = 0));
        setRows((prev) => [...prev, blank]);
      }

      function removeRow(id) {
        setRows((prev) => prev.filter((r) => r.id !== id));
        setAdjustments((prev) => prev.filter((a) => a.orderId !== id));
      }

      function addAdjustment() {
        const v = num(draftValue);
        const q = num(draftQty);
        if (!draftOrderId || v === 0 || q === 0) return;
        setAdjustments((prev) => [
          ...prev,
          { id: nextAdjId++, orderId: draftOrderId, material: draftMaterial, sign: draftSign, value: v, qty: q },
        ]);
        setDraftValue("");
        setDraftQty("");
      }

      function removeAdjustment(id) {
        setAdjustments((prev) => prev.filter((a) => a.id !== id));
      }

      function handleSave() {
        setSaveState("saving");
        setSaveError("");
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ rows, group, adjustments }));
          setSaveState("saved");
          setTimeout(() => setSaveState("idle"), 1800);
        } catch (e) {
          setSaveError("บันทึกไม่สำเร็จ: " + (e && e.message ? e.message : "เกิดข้อผิดพลาดในการเข้าถึง LocalStorage"));
          setSaveState("idle");
        }
      }

      function buildReportHTML() {
        const groupInfo = GROUPS[group];
        const rowsHtml = rows
          .map((r) => {
            const cells = MATERIAL_COLS.map((c) => `<td>${num(r[c.key])}</td>`).join("");
            return `<tr><td>${r.orderNo || "—"}</td>${cells}<td>${r.qty}</td></tr>`;
          })
          .join("");
        const resultRowsHtml = rows
          .map((r, i) => {
            const cells = MATERIAL_COLS.map((c) => `<td>${finalResults[i][c.key].toFixed(3)}</td>`).join("");
            return `<tr><td>${r.orderNo || "—"}</td>${cells}</tr>`;
          })
          .join("");
        const totalCells = MATERIAL_COLS.map((c) => `<td><b>${totals[c.key].toFixed(3)}</b></td>`).join("");
        const adjRowsHtml = adjustments
          .map((a) => {
            const rIdx = rows.findIndex((r) => r.id === a.orderId);
            const orderLabel = rIdx >= 0 ? rows[rIdx].orderNo || "—" : "—";
            const matLabel = MATERIAL_COLS.find((c) => c.key === a.material)?.label;
            return `<tr><td>${orderLabel}</td><td>${matLabel}</td><td>${a.sign === "reduce" ? "-" : "+"}${a.value}</td><td>${a.qty}</td></tr>`;
          })
          .join("");

        return `<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<title>Mix Design Report</title>
<style>
  body { font-family: 'Sarabun', sans-serif; color:#23211d; padding: 24px; }
  h1 { margin-bottom: 0; font-size: 24px; }
  .sub { color:#78766e; margin-top:4px; margin-bottom:20px; font-size:13px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; font-size: 12px; }
  th, td { border: 1px solid #999; padding: 6px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #23211d; color: #fff; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color:#78766e; border-bottom: 2px solid #23211d; padding-bottom: 4px; }
  @media print { .no-print { display:none; } }
</style>
</head>
<body>
  <div class="no-print" style="margin-bottom:16px;">
    <button onclick="window.print()" style="padding:8px 16px; font-weight:bold; cursor:pointer;">พิมพ์ / บันทึก PDF</button>
  </div>
  <h1>Mix Design — Korat Batching Plant</h1>
  <div class="sub">คำนวณมิกซ์ By Pongston &nbsp;|&nbsp; Group ${groupInfo.label} (${groupInfo.desc}) &nbsp;|&nbsp; พิมพ์เมื่อ ${new Date().toLocaleString("th-TH")}</div>

  <h2>วัตถุดิบต่อหน่วย (kg)</h2>
  <table>
    <tr><th>Order</th>${MATERIAL_COLS.map((c) => `<th>${c.label}</th>`).join("")}<th>จำนวน (คิว)</th></tr>
    ${rowsHtml}
  </table>

  ${adjustments.length ? `<h2>รายการปรับวัตถุดิบเพิ่มเติม</h2>
  <table>
    <tr><th>Order</th><th>วัตถุดิบ</th><th>ค่า</th><th>คิว</th></tr>
    ${adjRowsHtml}
  </table>` : ""}

  <h2>ผลลัพธ์ (ตัน / kg)</h2>
  <table>
    <tr><th>Order</th>${MATERIAL_COLS.map((c) => `<th>${c.label}</th>`).join("")}</tr>
    ${resultRowsHtml}
    <tr><td><b>รวม</b></td>${totalCells}</tr>
  </table>
</body></html>`;
      }

      function handlePrint() {
        const html = buildReportHTML();
        const printWindow = window.open("", "_blank");
        if (printWindow) {
          printWindow.document.write(html);
          printWindow.document.close();
        } else {
          // Fallback if popup is blocked: create download blob
          const blob = new Blob([html], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `mix-design-report-${Date.now()}.html`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
      }

      const orderOptions = rows.map((r, i) => ({ id: r.id, label: `${i + 1}. ${r.orderNo || "(ไม่ระบุเลขที่)"}` }));

      return (
        <div className="min-h-screen w-full bg-[#efece2]">
          <div className="max-w-6xl mx-auto px-4 py-6 sm:px-6 sm:py-10">
            {/* Header */}
            <div className="flex items-start justify-between gap-4 mb-5 border-b-2 pb-4 border-[#23211d]">
              <div>
                <div className="flex items-center gap-2 text-[#c1502e]">
                  <i data-lucide="layers" className="w-5 h-5 stroke-[2.5]"></i>
                  <span className="text-xs font-bold tracking-[0.2em] uppercase">Korat Batching Plant</span>
                </div>
                <h1
                  className="text-3xl sm:text-4xl font-black tracking-tight mt-1 text-[#23211d]"
                  style={{ fontFamily: "Georgia, 'Times New Roman', serif" }}
                >
                  Mix Design
                </h1>
                <p className="text-xs mt-1 text-[#78766e]">คำนวณมิกซ์ By Pongston</p>
              </div>
              <i data-lucide="calculator" className="w-6 h-6 hidden sm:block text-[#78766e]"></i>
            </div>

            {/* Horizontal Group Selector */}
            <div className="flex items-center gap-3 mb-6 flex-wrap">
              <span className="text-xs font-bold uppercase tracking-widest text-[#78766e]">Group</span>
              <div className="inline-flex border-2 border-[#23211d]">
                {Object.entries(GROUPS).map(([key, g], idx) => {
                  const active = group === key;
                  return (
                    <button
                      key={key}
                      onClick={() => setGroup(key)}
                      className="px-3 py-1.5 text-sm font-bold transition-colors"
                      style={{
                        background: active ? "#23211d" : "#ffffff",
                        color: active ? "#f5f3ee" : "#23211d",
                        borderLeft: idx === 0 ? "none" : "1px solid #23211d",
                      }}
                      title={g.desc}
                    >
                      {g.label}. <span style={{ color: active ? "#e8916b" : "#c1502e" }}>{g.short}</span>
                    </button>
                  );
                })}
              </div>
              <span className="text-xs text-[#a09d92]">{GROUPS[group].desc}</span>
            </div>

            {/* Input Table */}
            <div className="mb-2 text-xs font-bold uppercase tracking-widest text-[#78766e]">
              วัตถุดิบต่อหน่วย (kg) — แก้ไขได้
            </div>
            <div className="overflow-x-auto border-2 mb-4 border-[#23211d] bg-white shadow-sm">
              <table className="w-full text-sm" style={{ minWidth: 920 }}>
                <thead>
                  <tr className="bg-[#23211d] text-[#f5f3ee]">
                    <th className="text-left px-3 py-2 font-semibold sticky left-0 bg-[#23211d]" style={{ minWidth: 120 }}>
                      เลขที่ Order
                    </th>
                    {MATERIAL_COLS.map((c) => (
                      <th key={c.key} className="text-right px-3 py-2 font-semibold" style={{ minWidth: 90 }}>{c.label}</th>
                    ))}
                    <th className="text-right px-3 py-2 font-semibold" style={{ minWidth: 80 }}>จำนวน</th>
                    <th className="px-2 py-2" style={{ minWidth: 44 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={r.id} style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0", borderTop: "1px solid #e3e0d5" }}>
                      <td className="px-3 py-1.5 sticky left-0" style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0" }}>
                        <input
                          value={r.orderNo}
                          onChange={(e) => updateRow(r.id, "orderNo", e.target.value)}
                          className="w-full bg-transparent outline-none font-mono text-xs text-[#23211d]"
                          placeholder="—"
                        />
                      </td>
                      {MATERIAL_COLS.map((c) => (
                        <td key={c.key} className="px-2 py-1.5">
                          <input
                            type="number"
                            value={r[c.key]}
                            onChange={(e) => updateRow(r.id, c.key, e.target.value)}
                            className="w-full bg-transparent outline-none text-right font-mono"
                            style={{ color: c.key === "air" ? "#c1502e" : "#23211d" }}
                          />
                        </td>
                      ))}
                      <td className="px-2 py-1.5">
                        <input
                          type="number"
                          value={r.qty}
                          onChange={(e) => updateRow(r.id, "qty", e.target.value)}
                          className="w-full bg-transparent outline-none text-right font-mono font-semibold text-[#23211d]"
                        />
                      </td>
                      <td className="px-2 py-1.5 text-center">
                        <button onClick={() => removeRow(r.id)} title="ลบแถว" className="text-[#78766e] hover:text-[#c1502e] transition-colors">
                          <i data-lucide="trash-2" className="w-4 h-4 inline-block"></i>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <button
              onClick={addRow}
              className="mb-6 inline-flex items-center gap-1.5 px-3 py-2 text-xs font-bold uppercase tracking-wider border-2 border-[#23211d] text-[#23211d] bg-white hover:bg-[#23211d] hover:text-[#f5f3ee] transition-colors"
            >
              <i data-lucide="plus" className="w-3.5 h-3.5"></i> เพิ่มแถว
            </button>

            {/* Adjustment checkbox + panel */}
            <div className="mb-6 border-2 border-[#23211d] bg-white shadow-sm">
              <div 
                className="flex items-center gap-2 px-4 py-3 cursor-pointer select-none" 
                onClick={() => setShowAdjust((s) => !s)}
              >
                <span
                  className="w-5 h-5 flex items-center justify-center border-2 shrink-0 border-[#23211d]"
                  style={{ background: showAdjust ? "#c1502e" : "#ffffff" }}
                >
                  {showAdjust && <i data-lucide="check" className="w-3.5 h-3.5 text-white stroke-[3]"></i>}
                </span>
                <span className="text-sm font-bold text-[#23211d]">
                  ปรับวัตถุดิบเพิ่มเติมรายออเดอร์ (แสดงรายละเอียด 3 หัวข้อ)
                </span>
                <i 
                  data-lucide="chevron-down" 
                  className="w-4 h-4 ml-auto text-[#78766e] transition-transform duration-200"
                  style={{ transform: showAdjust ? "rotate(180deg)" : "none" }}
                ></i>
              </div>

              {showAdjust && (
                <div className="px-4 pb-4 pt-1 border-t-2 border-[#e3e0d5]">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 mt-3">
                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1 text-[#78766e]">1. เลขที่ออเดอร์</div>
                      <select
                        value={draftOrderId ?? ""}
                        onChange={(e) => setDraftOrderId(Number(e.target.value))}
                        className="w-full border-2 border-[#d8d5cb] px-2 py-1.5 text-sm bg-white text-[#23211d]"
                      >
                        {orderOptions.map((o) => (
                          <option key={o.id} value={o.id}>{o.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1 text-[#78766e]">2. ชนิดวัตถุดิบ</div>
                      <select
                        value={draftMaterial}
                        onChange={(e) => setDraftMaterial(e.target.value)}
                        className="w-full border-2 border-[#d8d5cb] px-2 py-1.5 text-sm bg-white text-[#23211d]"
                      >
                        {MATERIAL_COLS.map((c) => (
                          <option key={c.key} value={c.key}>{c.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1 text-[#78766e]">3. ค่า (กก.) / คิว</div>
                      <div className="flex gap-1">
                        <select
                          value={draftSign}
                          onChange={(e) => setDraftSign(e.target.value)}
                          className="border-2 border-[#d8d5cb] px-1 py-1.5 text-sm bg-white shrink-0 font-bold"
                          style={{ color: draftSign === "reduce" ? "#c1502e" : "#2e7d46" }}
                        >
                          <option value="add">เพิ่ม +</option>
                          <option value="reduce">ลด −</option>
                        </select>
                        <input
                          type="number"
                          value={draftValue}
                          onChange={(e) => setDraftValue(e.target.value)}
                          placeholder="ค่า"
                          className="w-full border-2 border-[#d8d5cb] px-2 py-1.5 text-sm font-mono text-[#23211d]"
                        />
                        <input
                          type="number"
                          value={draftQty}
                          onChange={(e) => setDraftQty(e.target.value)}
                          placeholder="คิว"
                          className="w-full border-2 border-[#d8d5cb] px-2 py-1.5 text-sm font-mono text-[#23211d]"
                        />
                      </div>
                    </div>

                    <div className="flex items-end">
                      <button
                        onClick={addAdjustment}
                        className="w-full px-3 py-2 text-xs font-bold uppercase tracking-wider bg-[#23211d] text-[#f5f3ee] hover:bg-[#c1502e] transition-colors"
                      >
                        4. รวมกับวัตถุดิบที่เลือก
                      </button>
                    </div>
                  </div>

                  {adjustments.length > 0 && (
                    <div className="mt-4 overflow-x-auto border-2 border-[#e3e0d5]">
                      <table className="w-full text-xs" style={{ minWidth: 560 }}>
                        <thead>
                          <tr className="bg-[#f0eee6] text-[#78766e]">
                            <th className="text-left px-2 py-1.5">ออเดอร์</th>
                            <th className="text-left px-2 py-1.5">วัตถุดิบ</th>
                            <th className="text-right px-2 py-1.5">ค่า</th>
                            <th className="text-right px-2 py-1.5">คิว</th>
                            <th className="text-right px-2 py-1.5">ผลรวม (kg→ton)</th>
                            <th className="px-2 py-1.5"></th>
                          </tr>
                        </thead>
                        <tbody>
                          {adjustments.map((a) => {
                            const rowIdx = rows.findIndex((r) => r.id === a.orderId);
                            const orderLabel = rowIdx >= 0 ? `${rowIdx + 1}. ${rows[rowIdx].orderNo || "—"}` : "—";
                            const matLabel = MATERIAL_COLS.find((c) => c.key === a.material)?.label;
                            const raw = a.material === "water" ? a.value * a.qty : a.value * a.qty * (1 - reduce) * 0.001;
                            const signed = a.sign === "reduce" ? -raw : raw;
                            return (
                              <tr key={a.id} className="border-t border-[#e3e0d5]">
                                <td className="px-2 py-1.5 font-mono">{orderLabel}</td>
                                <td className="px-2 py-1.5">{matLabel}</td>
                                <td 
                                  className="px-2 py-1.5 text-right font-mono font-bold" 
                                  style={{ color: a.sign === "reduce" ? "#c1502e" : "#2e7d46" }}
                                >
                                  {a.sign === "reduce" ? "−" : "+"}{a.value}
                                </td>
                                <td className="px-2 py-1.5 text-right font-mono">{a.qty}</td>
                                <td className="px-2 py-1.5 text-right font-mono font-semibold">{signed.toFixed(3)}</td>
                                <td className="px-2 py-1.5 text-center">
                                  <button onClick={() => removeAdjustment(a.id)} className="text-[#78766e] hover:text-[#c1502e]">
                                    <i data-lucide="trash-2" className="w-3.5 h-3.5 inline-block"></i>
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Results Table */}
            <div className="mb-2 text-xs font-bold uppercase tracking-widest text-[#78766e]">
              ผลลัพธ์ (Group {group} · {GROUPS[group].short}) — ตัน / kg{adjustments.length > 0 ? " · รวมรายการปรับแล้ว" : ""}
            </div>
            <div className="overflow-x-auto border-2 mb-4 border-[#23211d] bg-white shadow-sm">
              <table className="w-full text-sm" style={{ minWidth: 820 }}>
                <thead>
                  <tr className="bg-[#c1502e] text-[#f5f3ee]">
                    <th className="text-left px-3 py-2 font-semibold sticky left-0 bg-[#c1502e]" style={{ minWidth: 120 }}>
                      เลขที่ Order
                    </th>
                    {MATERIAL_COLS.map((c) => (
                      <th key={c.key} className="text-right px-3 py-2 font-semibold" style={{ minWidth: 100 }}>{c.label} ผลลัพธ์</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={r.id} style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0", borderTop: "1px solid #e3e0d5" }}>
                      <td className="px-3 py-1.5 font-mono text-xs sticky left-0" style={{ background: i % 2 === 0 ? "#ffffff" : "#f7f5f0" }}>
                        {r.orderNo || "—"}
                      </td>
                      {MATERIAL_COLS.map((c) => {
                        const adjusted = adjustmentContribution(r.id, c.key) !== 0;
                        return (
                          <td 
                            key={c.key} 
                            className="px-3 py-1.5 text-right font-mono" 
                            style={{ 
                              color: adjusted ? "#c1502e" : "#23211d", 
                              fontWeight: adjusted ? 700 : 400 
                            }}
                          >
                            {finalResults[i][c.key].toFixed(3)}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                  <tr className="border-t-2 border-[#23211d] bg-[#f0eee6]">
                    <td className="px-3 py-2 font-bold text-xs uppercase sticky left-0 bg-[#f0eee6] text-[#23211d]">รวม / Total</td>
                    {MATERIAL_COLS.map((c) => (
                      <td key={c.key} className="px-3 py-2 text-right font-mono font-bold text-[#c1502e]">
                        {totals[c.key].toFixed(3)}
                      </td>
                    ))}
                  </tr>
                </tbody>
              </table>
            </div>

            {/* Save / Print actions */}
            <div className="flex flex-wrap gap-2 items-center">
              <button
                onClick={handleSave}
                className="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold uppercase tracking-wider bg-[#23211d] text-[#f5f3ee] hover:bg-[#3d3a34] transition-colors"
              >
                <i data-lucide="save" className="w-3.5 h-3.5"></i>
                {saveState === "saving" ? "กำลังบันทึก..." : saveState === "saved" ? "บันทึกแล้ว ✓" : "บันทึก"}
              </button>
              <button
                onClick={handlePrint}
                className="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold uppercase tracking-wider border-2 border-[#23211d] text-[#23211d] bg-white hover:bg-[#23211d] hover:text-[#f5f3ee] transition-colors"
              >
                <i data-lucide="printer" className="w-3.5 h-3.5"></i> พิมพ์ / บันทึก PDF
              </button>
              {saveError && <span className="text-xs text-[#c1502e] font-semibold">{saveError}</span>}
            </div>

            <p className="text-xs mt-4 text-[#a09d92]">
              สูตร: ผลลัพธ์ = วัตถุดิบ × จำนวน × (1 − % หักของกลุ่ม) × 0.001 (แปลง กก. → ตัน) · น้ำไม่ถูกหักเปอร์เซ็นต์และไม่แปลงหน่วย ·
              คอลัมน์ Air ใช้สูตรเดียวกับ Cement · รายการปรับต่อออเดอร์จะถูกบวก/ลบเข้ากับผลลัพธ์ของวัตถุดิบนั้นโดยตรง
            </p>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
