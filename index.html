    const seedRows = [

    /* =========================================================
       HELPERS
    ========================================================= */
    function num(v) {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : 0;
    }
    /*
      Password hash
      ใช้ Web Crypto เมื่อ browser รองรับ
      และมี fallback เพื่อให้ไฟล์ HTML ใช้งานได้กว้างขึ้น
    */
    async function sha256(message) {
      const text = String(message ?? "");
      try {
        if (
          window.crypto &&
          window.crypto.subtle &&
          window.TextEncoder
        ) {
          const buffer =
            new TextEncoder().encode(text);
          const hashBuffer =
            await window.crypto.subtle.digest(
              "SHA-256",
              buffer
            );
          return Array
            .from(new Uint8Array(hashBuffer))
            .map(
              b => b.toString(16).padStart(2, "0")
            )
            .join("");
        }
      } catch (error) {
        console.warn(
          "SHA-256 unavailable:",
          error
        );
      }
      /*
        Fallback สำหรับ local/offline environment
        ไม่ควรใช้แทน backend authentication
      */
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash =
          ((hash << 5) - hash) +
          text.charCodeAt(i);
        hash |= 0;
      }
      return "fallback_" +
        Math.abs(hash).toString(16);
    }
    async function buildDefaultUsers() {
      const result = [];
      for (const account of DEFAULT_ACCOUNTS) {
        result.push({
          id: account.id,
          username: account.username,
          passwordHash: await sha256(
            account.password
          ),
          role: account.role,
          active: account.active

      }
      return result;
    }
    const Icon = ({

      size = 18,

    }) => {
      useEffect(() => {

    };
    /* =========================================================
       ROOT APP
    ========================================================= */
    function App() {
      const [currentUser, setCurrentUser] =
        useState(null);
      const [users, setUsers] =
        useState([]);
      const [isInitialized, setIsInitialized] =
        useState(false);
      useEffect(() => {
        async function initializeUsers() {
          try {
            const saved =
              localStorage.getItem(
                USERS_STORAGE_KEY
              );
            if (saved) {
              const parsed =
                JSON.parse(saved);
              if (
                Array.isArray(parsed) &&
                parsed.length
              ) {
                setUsers(parsed);
              } else {
                const defaults =
                  await buildDefaultUsers();
                setUsers(defaults);
                localStorage.setItem(
                  USERS_STORAGE_KEY,
                  JSON.stringify(defaults)
                );
              }
            } else {
              const defaults =
                await buildDefaultUsers();
              setUsers(defaults);
              localStorage.setItem(
                USERS_STORAGE_KEY,
                JSON.stringify(defaults)
              );
            }
          } catch (error) {
            console.error(
              "User initialization error:",
              error
            );
            const defaults =
              await buildDefaultUsers();
            setUsers(defaults);
            try {
              localStorage.setItem(
                USERS_STORAGE_KEY,
                JSON.stringify(defaults)
              );
            } catch (storageError) {
              console.error(
                storageError
              );
            }
          }
          setIsInitialized(true);
        }
        initializeUsers();
      }, []);
      function saveUsers(newUsers) {
        setUsers(newUsers);
        try {
          localStorage.setItem(
            USERS_STORAGE_KEY,
            JSON.stringify(newUsers)
          );
        } catch (error) {
          console.error(
            "Save users error:",
            error
          );
        }
      }
      if (!isInitialized) {
        return (
          <div className="min-h-screen bg-[#121212] flex flex-col items-center justify-center text-white">
            <Icon
              name="layers"
              size={34}
              color="#c1502e"
            />
            <div className="mt-4 text-sm font-bold">
              Loading System...
            </div>
            <div className="mt-2 text-[10px] text-gray-500 uppercase tracking-[0.25em]">
              Mix Design V11
            </div>
          </div>
        );
      }
      if (!currentUser) {
        return (
          <LoginPage
            users={users}
            onLogin={setCurrentUser}
          />
        );
      }
      return (
        <MainDashboard
          currentUser={currentUser}
          users={users}
          onUpdateUsers={saveUsers}
          onLogout={() => setCurrentUser(null)}
        />
      );
    }
    /* =========================================================
       LOGIN
    ========================================================= */
    function LoginPage({
      users,
      onLogin
    }) {
      const [username, setUsername] =
        useState("");
      const [password, setPassword] =
        useState("");
      const [error, setError] =
        useState("");
      const [loading, setLoading] =
        useState(false);
      const [showPassword, setShowPassword] =
        useState(false);
      async function handleSignIn(e) {
        e.preventDefault();
        setError("");
        const cleanUsername =
          username.trim();
        if (
          !cleanUsername ||
          !password
        ) {
          setError(
            "⚠️ กรุณากรอก Username และ Password ให้ครบถ้วน"
          );
          return;
        }
        setLoading(true);
        const inputHash =
          await sha256(password);
        const found =
          users.find(user =>
            user.username.toLowerCase() ===
              cleanUsername.toLowerCase() &&
            user.passwordHash ===
              inputHash
          );
        setLoading(false);
        if (!found) {
          setError(
            "❌ Username หรือ Password ไม่ถูกต้อง"
          );
          return;
        }
        if (!found.active) {
          setError(
            "🚫 บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อ Administrator"
          );
          return;
        }
        onLogin(found);
      }
      return (
        <div className="login-bg min-h-screen flex flex-col items-center justify-center w-full p-4 relative overflow-hidden">

          </div>

    /* =========================================================
       MAIN DASHBOARD
    ========================================================= */
    function MainDashboard({
      currentUser,
      users,
      onUpdateUsers,
      onLogout
    }) {
      const [group, setGroup] =
        useState("A");
      const [rows, setRows] =
        useState(seedRows);
      const [showAdjust, setShowAdjust] =
        useState(false);
      const [adjustments, setAdjustments] =
        useState([]);
      const [saveState, setSaveState] =
        useState("idle");
      const [draftOrderId, setDraftOrderId] =
        useState(null);
      const [draftMaterial, setDraftMaterial] =
        useState(
          MATERIAL_COLS[0].key
        );
      const [draftSign, setDraftSign] =
        useState("add");
      const [draftValue, setDraftValue] =
        useState("");
      const [draftQty, setDraftQty] =
        useState("");
      const [showAdminModal, setShowAdminModal] =
        useState(false);
      const [newUsername, setNewUsername] =
        useState("");
      const [newPassword, setNewPassword] =
        useState("");
      const [newRole, setNewRole] =
        useState("USER");
      const [showResetConfirm, setShowResetConfirm] =
        useState(false);
      const isAdmin =
        String(currentUser.role)
          .toUpperCase() === "ADMIN";
      const reduce =
        GROUPS[group].reduce;
      /* -------------------------------------------------------
         Load Mix Design
      ------------------------------------------------------- */
      useEffect(() => {
        try {
          const saved =
            localStorage.getItem(
              STORAGE_KEY
            );
          if (!saved) {
            return;
          }
          const data =
            JSON.parse(saved);
          if (
            Array.isArray(data.rows) &&
            data.rows.length
          ) {
            setRows(data.rows);
            nextRowId =
              Math.max(
                ...data.rows.map(
                  r => num(r.id)
                )
              ) + 1;
          }
          if (
            data.group &&
            GROUPS[data.group]
          ) {
            setGroup(data.group);
          }
          if (
            Array.isArray(
              data.adjustments
            )
          ) {
            setAdjustments(
              data.adjustments
            );
            nextAdjId =
              data.adjustments.length
                ? Math.max(
                    ...data.adjustments.map(
                      a => num(a.id)
                    )
                  ) + 1
                : 1;
          }
        } catch (error) {
          console.error(
            "Load data error:",
            error
          );
        }
      }, []);
      /* -------------------------------------------------------
         Draft Order
      ------------------------------------------------------- */
      useEffect(() => {
        if (
          rows.length &&
          (
            draftOrderId === null ||
            !rows.some(
              r =>
                r.id === draftOrderId
            )
          )
        ) {
          setDraftOrderId(
            rows[0].id
          );
        }
      }, [
        rows,
        draftOrderId
      ]);
      /* -------------------------------------------------------
         Base Calculation
      ------------------------------------------------------- */
      const baseResults = useMemo(() => {
        return rows.map(row => {
          const qty =
            num(row.qty);
          const output = {};
          MATERIAL_COLS.forEach(
            col => {
              const value =
                num(row[col.key]);
              /*
                น้ำ:
                kg/cubic meter × quantity
                ไม่ลดตาม Group
                วัตถุดิบอื่น:
                kg/cubic meter × quantity
                × Group factor
                × 0.001 = ton
              */
              output[col.key] =
                col.key === "water"
                  ? value * qty
                  : value *
                    qty *
                    (1 - reduce) *
                    0.001;
            }
          );
          return output;
        });
      }, [
        rows,
        reduce
      ]);
      /* -------------------------------------------------------
         Adjustment
      ------------------------------------------------------- */
      function adjustmentContribution(
        orderId,
        materialKey
      ) {
        return adjustments
          .filter(
            a =>
              a.orderId === orderId &&
              a.material === materialKey
          )
          .reduce(
            (sum, a) => {
              const raw =
                materialKey === "water"
                  ? num(a.value) *
                    num(a.qty)
                  : num(a.value) *
                    num(a.qty) *
                    (1 - reduce) *
                    0.001;
              return (
                sum +
                (
                  a.sign === "reduce"
                    ? -raw
                    : raw
                )
              );
            },
            0
          );
      }
      const finalResults =
        useMemo(() => {
          return rows.map(
            (row, index) => {
              const output = {};
              MATERIAL_COLS.forEach(
                col => {
                  output[col.key] =
                    baseResults[index][
                      col.key
                    ] +
                    adjustmentContribution(
                      row.id,
                      col.key
                    );
                }
              );
              return output;
            }
          );
        }, [
          rows,
          baseResults,
          adjustments,
          reduce
        ]);
      /* -------------------------------------------------------
         Totals
      ------------------------------------------------------- */
      const totals = useMemo(() => {
        const total = {};
        MATERIAL_COLS.forEach(
          col => {
            total[col.key] = 0;
          }
        );
        finalResults.forEach(
          result => {
            MATERIAL_COLS.forEach(
              col => {
                total[col.key] +=
                  result[col.key];
              }
            );
          }
        );
        return total;
      }, [
        finalResults
      ]);
      /* -------------------------------------------------------
         Row Actions
      ------------------------------------------------------- */
      function updateRow(
        id,
        key,
        value
      ) {
        setRows(prev =>
          prev.map(row =>
            row.id === id
              ? {
                  ...row,
                  [key]: value
                }
              : row
          )
        );
      }
      function addRow() {
        const blank = {
          id: nextRowId++,
          orderNo: "",
          qty: 0
        };
        MATERIAL_COLS.forEach(
          col => {
            blank[col.key] = 0;
          }
        );
        setRows(prev => [
          ...prev,
          blank
        ]);
      }
      function removeRow(id) {
        if (
          rows.length <= 1
        ) {
          alert(
            "ต้องมีอย่างน้อย 1 แถว"
          );
          return;
        }
        setRows(prev =>
          prev.filter(
            row => row.id !== id
          )
        );
        setAdjustments(prev =>
          prev.filter(
            a =>
              a.orderId !== id
          )
        );
      }
      /* -------------------------------------------------------
         Adjustment Actions
      ------------------------------------------------------- */
      function addAdjustment() {
        const value =
          num(draftValue);
        const qty =
          num(draftQty);
        if (
          !draftOrderId ||
          value === 0 ||
          qty === 0
        ) {
          alert(
            "กรุณาระบุ Order, ค่า และจำนวนคิว"
          );
          return;
        }
        setAdjustments(prev => [
          ...prev,
          {
            id: nextAdjId++,
            orderId: draftOrderId,
            material: draftMaterial,
            sign: draftSign,
            value,
            qty
          }
        ]);
        setDraftValue("");
        setDraftQty("");
      }
      function removeAdjustment(id) {
        setAdjustments(prev =>
          prev.filter(
            a => a.id !== id
          )
        );
      }
      /* -------------------------------------------------------
         Save
      ------------------------------------------------------- */
      function handleSave() {
        setSaveState("saving");
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              rows,
              group,
              adjustments,
              savedAt:
                new Date().toISOString(),
              version: APP_VERSION
            })
          );
          setSaveState("saved");
          setTimeout(() => {
            setSaveState("idle");
          }, 1800);

      async function handleCreateUser(e) {
        e.preventDefault();
        const username =

        const password =
          newPassword;
        if (!username || !password) {
          alert(
            "กรุณากรอก Username และ Password"
          );
          return;
        }
        if (
          username.length < 2
        ) {
          alert(

          );
          return;
        }
        if (
          password.length < 1
        ) {
          alert(
            "Password ไม่สามารถเป็นค่าว่างได้"
          );
          return;
        }
        const exists =
          users.some(
            user =>
              user.username
                .toLowerCase() ===
              username.toLowerCase()
          );
        if (exists) {
          alert(
            "Username นี้มีผู้ใช้งานแล้วในระบบ"
          );
          return;
        }
        const passwordHash =
          await sha256(password);
        const updated = [
          ...users,
          {
            id:
              Date.now(),
            username,
            passwordHash,
            role: newRole,
            active: true
          }
        ];
        onUpdateUsers(
          updated
        );
        setNewUsername("");
        setNewPassword("");
        setNewRole("USER");
        alert(
          `สร้าง User "${username}" สำเร็จแล้ว`
        );
      }
      function handleToggleActive(id) {
        const target =
          users.find(
            user =>
              user.id === id
          );
        if (!target) {
          return;
        }
        /*
          ป้องกันการปิด ADMIN คนสุดท้าย
        */
        if (
          target.role.toUpperCase() ===
            "ADMIN" &&
          target.active &&
          users.filter(
            user =>
              user.role.toUpperCase() ===
                "ADMIN" &&
              user.active
          ).length <= 1
        ) {
          alert(
            "ไม่สามารถปิดใช้งาน Administrator คนสุดท้ายของระบบได้"
          );
          return;
        }
        const updated =
          users.map(
            user =>
              user.id === id
                ? {
                    ...user,
                    active:
                      !user.active
                  }
                : user
          );
        onUpdateUsers(
          updated

                          borderColor:
                            "#d8d5cb",
                          color:
                            "#23211d"
                        }}
                      >
                        {orderOptions.map(
                          option => (
                            <option
                              key={
                                option.id
                              }
                              value={
                                option.id
                              }
                            >
                              {
                                option.label
                              }
                            </option>
                          )
                        )}
                      </select>
                    </div>
                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1">
                        2. ชนิดวัตถุดิบ
                      </div>
                      <select
                        value={
                          draftMaterial
                        }
                        onChange={e =>
                          setDraftMaterial(
                            e.target
                              .value
                          )
                        }
                        className="w-full border-2 px-2 py-1.5 text-sm bg-white"
                        style={{
                          borderColor:
                            "#d8d5cb",
                          color:
                            "#23211d"
                        }}
                      >
                        {MATERIAL_COLS.map(
                          col => (
                            <option
                              key={
                                col.key
                              }
                              value={
                                col.key
                              }
                            >
                              {
                                col.label
                              }
                            </option>
                          )
                        )}
                      </select>
                    </div>
                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider mb-1">
                        3. ค่า / คิว
                      </div>
                      <div className="flex gap-1">
                        <select
                          value={
                            draftSign
                          }
                          onChange={e =>
                            setDraftSign(
                              e.target
                                .value
                            )
                          }
                          className="border-2 px-1 py-1.5 text-sm bg-white shrink-0"
                          style={{
                            borderColor:
                              "#d8d5cb",
                            color:
                              draftSign ===
                              "reduce"
                                ? "#c1502e"
                                : "#2e7d46"
                          }}
                        >
                          <option value="add">
                            เพิ่ม +
                          </option>
                          <option value="reduce">
                            ลด −
                          </option>
                        </select>
                        <input
                          type="number"
                          inputMode="decimal"
                          value={
                            draftValue
                          }
                          onChange={e =>
                            setDraftValue(
                              e.target
                                .value
                            )
                          }
                          placeholder="kg"
                          className="w-full border-2 px-2 py-1.5 text-sm font-mono"
                          style={{
                            borderColor:
                              "#d8d5cb"
                          }}
                        />
                        <input
                          type="number"
                          inputMode="decimal"
                          value={
                            draftQty
                          }
                          onChange={e =>
                            setDraftQty(
                              e.target
                                .value
                            )
                          }
                          placeholder="คิว"
                          className="w-full border-2 px-2 py-1.5 text-sm font-mono"
                          style={{
                            borderColor:
                              "#d8d5cb"
                          }}
                        />
                      </div>
                    </div>
                    <div className="flex items-end">
                      <button
                        onClick={
                          addAdjustment
                        }
                        className="w-full px-3 py-2 text-xs font-bold uppercase tracking-wider cursor-pointer"
                        style={{
                          background:
                            "#23211d",
                          color:
                            "#f5f3ee"
                        }}
                      >
                        เพิ่มรายการปรับ
                      </button>
                    </div>
                  </div>
                  {adjustments.length > 0 && (
                    <div className="mt-5 overflow-x-auto border-2 border-[#e3e0d5]">
                      <table className="w-full text-xs">
                        <thead>
                          <tr className="bg-[#f7f5f0]">
                            <th className="text-left p-2">
                              Order
                            </th>
                            <th className="text-left p-2">
                              วัตถุดิบ
                            </th>
                            <th className="text-right p-2">
                              ค่า
                            </th>
                            <th className="text-right p-2">
                              คิว
                            </th>
                            <th className="text-center p-2">
                            </th>
                          </tr>
                        </thead>
                        <tbody>
                          {adjustments.map(
                            adjustment => {
                              const row =
                                rows.find(
                                  r =>
                                    r.id ===
                                    adjustment.orderId
                                );
                              const material =
                                MATERIAL_COLS.find(
                                  col =>
                                    col.key ===
                                    adjustment.material
                                );
                              return (
                                <tr
                                  key={
                                    adjustment.id
                                  }
                                  className="border-t border-[#e3e0d5]"
                                >
                                  <td className="p-2 font-mono">
                                    {
                                      row?.orderNo ||
                                      "—"
                                    }
                                  </td>
                                  <td className="p-2">
                                    {
                                      material?.label
                                    }
                                  </td>
                                  <td
                                    className="p-2 text-right font-mono font-bold"
                                    style={{
                                      color:
                                        adjustment.sign ===
                                        "reduce"
                                          ? "#c1502e"
                                          : "#2e7d46"
                                    }}
                                  >
                                    {adjustment.sign ===
                                    "reduce"
                                      ? "-"
                                      : "+"}
                                    {
                                      adjustment.value
                                    }
                                  </td>
                                  <td className="p-2 text-right font-mono">
                                    {
                                      adjustment.qty
                                    }
                                  </td>
                                  <td className="p-2 text-center">
                                    <button
                                      onClick={() =>
                                        removeAdjustment(
                                          adjustment.id
                                        )
                                      }
                                      className="text-red-500 hover:text-red-700 cursor-pointer"
                                    >
                                      <Icon
                                        name="trash-2"
                                        size={14}
                                      />
                                    </button>
                                  </td>
                                </tr>
                              );
                            }
                          )}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}
            </div>
            {/* =================================================
                RESULTS
            ================================================= */}
            <div
              className="mb-2 text-xs font-bold uppercase tracking-widest"
              style={{
                color:
                  "#78766e"
              }}
            >
              ผลลัพธ์
              {" "}
              (Group {group}
              {" · "}
              {
                GROUPS[group]
                  .short
              })
              — ตัน / kg
            </div>
            <div
              className="overflow-x-auto border-2 mb-4"
              style={{
                borderColor:
                  "#23211d",
                background:
                  "#ffffff"
              }}
            >
              <table
                className="w-full text-sm"
                style={{
                  minWidth: 820
                }}
              >
                <thead>
                  <tr
                    style={{
                      background:
                        "#c1502e",
                      color:
                        "#f5f3ee"
                    }}
                  >
                    <th
                      className="text-left px-3 py-2 font-semibold sticky left-0"
                      style={{
                        background:
                          "#c1502e",
                        minWidth:
                          120
                      }}
                    >
                      เลขที่ Order
                    </th>
                    {MATERIAL_COLS.map(
                      col => (
                        <th
                          key={
                            col.key
                          }
                          className="text-right px-3 py-2 font-semibold"
                          style={{
                            minWidth:
                              100
                          }}
                        >
                          {
                            col.label
                          }
                          {" "}
                          ผลลัพธ์
                        </th>
                      )
                    )}
                  </tr>
                </thead>
                <tbody>
                  {rows.map(
                    (
                      row,
                      index
                    ) => (
                      <tr
                        key={
                          row.id
                        }
                        style={{
                          background:
                            index %
                              2 ===
                            0
                              ? "#ffffff"
                              : "#f7f5f0",
                          borderTop:
                            "1px solid #e3e0d5"
                        }}
                      >
                        <td
                          className="px-3 py-1.5 font-mono text-xs sticky left-0"
                          style={{
                            background:
                              index %
                                2 ===
                              0
                                ? "#ffffff"
                                : "#f7f5f0"
                          }}
                        >
                          {
                            row.orderNo ||
                            "—"
                          }
                        </td>
                        {MATERIAL_COLS.map(
                          col => (
                            <td
                              key={
                                col.key
                              }
                              className="px-3 py-1.5 text-right font-mono"
                            >
                              {finalResults[
                                index
                              ][
                                col.key
                              ].toFixed(3)}
                            </td>
                          )
                        )}
                      </tr>
                    )
                  )}
                  <tr
                    style={{
                      borderTop:
                        "2px solid #23211d",
                      background:
                        "#f0eee6"
                    }}
                  >
                    <td
                      className="px-3 py-2 font-bold text-xs uppercase sticky left-0"
                      style={{
                        background:
                          "#f0eee6",
                        color:
                          "#23211d"
                      }}
                    >
                      รวม / Total
                    </td>
                    {MATERIAL_COLS.map(
                      col => (
                        <td
                          key={
                            col.key
                          }
                          className="px-3 py-2 text-right font-mono font-bold"
                          style={{
                            color:
                              "#c1502e"
                          }}
                        >
                          {totals[
                            col.key
                          ].toFixed(3)}
                        </td>
                      )
                    )}
                  </tr>
                </tbody>
              </table>
            </div>
            {/* =================================================
                ACTIONS
            ================================================= */}
            <div className="flex flex-wrap gap-2 items-center pb-10">
              <button
                onClick={
                  handleSave
                }
                className="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold uppercase tracking-wider cursor-pointer"
                style={{
                  background:
                    "#23211d",
                  color:
                    "#f5f3ee"
                }}
              >
                <Icon
                  name="save"
                  size={14}
                />
                {
                  saveState ===
                  "saving"
                    ? "กำลังบันทึก..."
                    : saveState ===
                      "saved"
                    ? "บันทึกแล้ว ✓"
                    : "บันทึกข้อมูล"
                }
              </button>
              <button
                onClick={
                  handlePrint
                }
                className="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold uppercase tracking-wider border-2 cursor-pointer bg-white hover:bg-gray-50"
                style={{
                  borderColor:
                    "#23211d",
                  color:
                    "#23211d"
                }}
              >
                <Icon
                  name="printer"
                  size={14}
                />
                พิมพ์ / บันทึก PDF
              </button>
              <div className="ml-auto text-[10px] text-[#a09d92]">
                Local Storage
                {" · "}
                V{APP_VERSION}
              </div>
            </div>
          </div>
          {/* ===================================================
              RESET MODAL
          =================================================== */}
          {showResetConfirm && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white border-2 border-[#23211d] max-w-sm w-full rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
                    <Icon
                      name="rotate-ccw"
                      size={20}
                      color="#c1502e"
                    />
                  </div>
                  <div>
                    <h3 className="font-black text-[#23211d]">
                      รีเซ็ตข้อมูล
                    </h3>
                    <p className="text-xs text-gray-500">
                      Reset Mix Design
                    </p>
                  </div>
                </div>
                <p className="text-sm text-gray-700 leading-relaxed">
                  ต้องการรีเซ็ตข้อมูล Mix Design
                  กลับเป็นค่าเริ่มต้นหรือไม่?
                  <br />
                  ข้อมูลที่บันทึกไว้ใน Version 11
                  จะถูกล้าง
                </p>
                <div className="flex gap-2 mt-6">
                  <button
                    onClick={() =>
                      setShowResetConfirm(
                        false
                      )
                    }
                    className="flex-1 border-2 border-[#23211d] py-2.5 text-xs font-bold cursor-pointer"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={
                      resetMixData
                    }
                    className="flex-1 bg-[#c1502e] text-white py-2.5 text-xs font-bold cursor-pointer"
                  >
                    รีเซ็ตข้อมูล
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* ===================================================
              ADMIN MODAL
          =================================================== */}
          {showAdminModal &&
            isAdmin && (
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                <div className="bg-[#fcfbfa] border-2 border-[#23211d] max-w-2xl w-full rounded-2xl p-5 sm:p-6 shadow-2xl max-h-[92vh] overflow-y-auto modal-scroll">
                  {/* HEADER */}
                  <div className="flex justify-between items-center mb-5 pb-3 border-b-2 border-[#23211d]">
                    <h3 className="text-base font-black uppercase text-[#23211d] flex items-center gap-2">
                      <Icon
                        name="shield"
                        size={20}
                        color="#c1502e"
                      />
                      ระบบจัดการผู้ใช้งาน
                    </h3>
                    <button
                      onClick={() =>
                        setShowAdminModal(
                          false
                        )
                      }
                      className="text-[#78766e] hover:text-black font-bold text-lg cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>
                  {/* CREATE USER */}
                  <form
                    onSubmit={
                      handleCreateUser
                    }
                    className="mb-6 p-4 border-2 border-[#d8d5cb] bg-white rounded-xl shadow-xs"
                  >
                    <h4 className="text-xs font-bold uppercase tracking-wider mb-3 text-[#23211d]">
                      ➕ สร้างบัญชีผู้ใช้งานใหม่
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mb-3">
                      <input
                        type="text"
                        placeholder="Username"
                        value={
                          newUsername
                        }
                        onChange={e =>
                          setNewUsername(
                            e.target
                              .value
                          )
                        }
                        className="border-2 border-[#d8d5cb] px-3 py-2 text-sm rounded focus:outline-none focus:border-[#23211d]"
                        required
                      />
                      <input
                        type="password"
                        placeholder="Password"
                        value={
                          newPassword
                        }
                        onChange={e =>
                          setNewPassword(
                            e.target
                              .value
                          )
                        }
                        className="border-2 border-[#d8d5cb] px-3 py-2 text-sm rounded focus:outline-none focus:border-[#23211d]"
                        required
                      />
                      <select
                        value={
                          newRole
                        }
                        onChange={e =>
                          setNewRole(
                            e.target
                              .value
                          )
                        }
                        className="border-2 border-[#d8d5cb] px-3 py-2 text-sm rounded bg-white font-bold"
                      >
                        <option value="USER">
                          USER
                        </option>
                        <option value="ADMIN">
                          ADMIN
                        </option>
                      </select>
                    </div>
                    <button
                      type="submit"
                      className="w-full bg-[#23211d] text-white py-2.5 text-xs font-bold uppercase rounded cursor-pointer hover:bg-black transition"
                    >
                      บันทึกสร้าง User
                    </button>
                  </form>
                  {/* USER LIST */}
                  <div className="flex items-center justify-between mb-2">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-[#78766e]">
                      📋 รายชื่อผู้ใช้งาน
                      {" "}
                      ({users.length})
                    </h4>
                    <span className="text-[9px] text-gray-400">
                      V{APP_VERSION}
                    </span>
                  </div>
                  <div className="border-2 border-[#23211d] rounded-xl overflow-hidden bg-white">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs min-w-[620px]">
                        <thead className="bg-[#23211d] text-white">
                          <tr>
                            <th className="p-3">
                              Username
                            </th>
                            <th className="p-3">
                              Role
                            </th>
                            <th className="p-3 text-center">
                              สถานะ
                            </th>
                            <th className="p-3 text-right">
                              การจัดการ
                            </th>
                          </tr>
                        </thead>
                        <tbody>
                          {users.map(
                            user => (
                              <tr
                                key={
                                  user.id
                                }
                                className="border-t border-[#e3e0d5]"
                              >
                                <td className="p-3 font-bold font-mono">
                                  {
                                    user.username
                                  }
                                  {user.id ===
                                    currentUser.id && (
                                    <span className="ml-2 text-[9px] text-[#c1502e]">
                                      YOU
                                    </span>
                                  )}
                                </td>
                                <td className="p-3">
                                  <span
                                    className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                      user.role.toUpperCase() ===
                                      "ADMIN"
                                        ? "bg-[#c1502e] text-white"
                                        : "bg-gray-200 text-gray-800"
                                    }`}
                                  >
                                    {
                                      user.role.toUpperCase()
                                    }
                                  </span>
                                </td>
                                <td className="p-3 text-center">
                                  <button
                                    onClick={() =>
                                      handleToggleActive(
                                        user.id
                                      )
                                    }
                                    className={`px-2.5 py-1 rounded text-[10px] font-bold cursor-pointer transition ${
                                      user.active
                                        ? "bg-green-100 text-green-800 hover:bg-green-200"
                                        : "bg-red-100 text-red-800 hover:bg-red-200"
                                    }`}
                                    title="คลิกเพื่อสลับสถานะ"
                                  >
                                    {user.active
                                      ? "🟢 เปิดใช้งาน"
                                      : "🔴 ปิดใช้งาน"}
                                  </button>
                                </td>
                                <td className="p-3 text-right">
                                  <div className="flex justify-end gap-1 flex-wrap">
                                    <button
                                      onClick={() =>
                                        handleChangePassword(
                                          user.id,
                                          user.username
                                        )
                                      }
                                      className="px-2.5 py-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-[11px] font-bold cursor-pointer text-[#23211d]"
                                    >
                                      เปลี่ยนรหัส
                                    </button>
                                    <button
                                      onClick={() =>
                                        handleDeleteUser(
                                          user.id
                                        )
                                      }
                                      className="px-2.5 py-1 bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 rounded text-[11px] font-bold cursor-pointer"
                                    >
                                      ลบ
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            )
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                  {/* SECURITY NOTE */}
                  <div className="mt-4 p-3 rounded-xl bg-[#f5f3ee] border border-[#e3e0d5]">
                    <div className="flex items-start gap-2">
                      <Icon
                        name="info"
                        size={15}
                        color="#c1502e"
                      />
                      <div className="text-[10px] leading-relaxed text-[#78766e]">
                        Password ถูกเก็บเป็น
                        SHA-256 hash ใน
                        Local Storage
                        ของ browser
                        <br />
                        ระบบนี้เป็นระบบ
                        Client-side
                        สำหรับใช้งานภายใน
                        หากต้องการระบบ
                        Authentication
                        แบบ production
                        ควรเชื่อมต่อ
                        Backend / Database
                      </div>
                    </div>
                  </div>
                  {/* CLOSE */}
                  <div className="mt-6 text-right">
                    <button
                      onClick={() =>
                        setShowAdminModal(
                          false
                        )
                      }
                      className="px-5 py-2.5 bg-[#23211d] text-white text-xs font-bold uppercase rounded cursor-pointer hover:bg-black"
                    >
                      ปิดหน้าต่าง
                    </button>
                  </div>
                </div>
              </div>
            )}
        </div>
      );
    }
    /* =========================================================
       RENDER
    ========================================================= */
    ReactDOM
      .createRoot(
        document.getElementById(
          "root"
        )
      )
      .render(
        <App />
      );
  </script>
</body>
</html>
